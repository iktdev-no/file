name: Build and publish release to Reposilite

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and publish release
        run: ./gradlew --no-daemon clean test publish
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          reposiliteUsername: ${{ secrets.reposiliteUsername }}
          reposilitePassword: ${{ secrets.reposilitePassword }}
